name: Accessibility and contrast

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pa11y:
    name: WCAG contrast and accessibility scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build -- --webpack

      - name: Start static site
        run: npx --yes http-server out -p 4173 > /tmp/tapid-web-http-server.log 2>&1 &

      - name: Wait for static site
        run: curl --fail --retry 10 --retry-delay 1 http://127.0.0.1:4173/

      - name: Run Pa11y against every route
        run: npx --yes pa11y-ci@4.0.1 --config .pa11yci.json
